name: Export verified Manticore lock
on:
  pull_request:
    paths:
      - '.github/workflows/export-manticore-lock.yml'
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v4.3.0
        with:
          name: manticore-image-comparison
          run-id: 45616270713
          github-token: ${{ github.token }}
          path: verified-artifact
      - name: Verify and export the public Composer lock
        run: |
          set -euo pipefail
          cd verified-artifact
          echo '04f9ff16e54a364e87934d0a71cf7adc291e2e54a94d46596a24725043cc7431  manticore-composer.lock' | sha256sum -c -
          base64 -w 512 manticore-composer.lock | sed 's/^/LOCK_B64:/'
          printf '\nLOCK_EXPORT_COMPLETE\n'
