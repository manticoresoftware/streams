name: Manticore image size

on:
  pull_request:
    paths:
      - 'docker/manticore/**'
      - '.github/workflows/manticore-image-size.yml'

permissions:
  contents: read

concurrency:
  group: manticore-image-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.0
        with:
          fetch-depth: 0
      - name: Build all four images against the same base digest
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          sh -n docker/manticore/prune-runtime.sh
          mkdir -p "$RUNNER_TEMP/manticore-baseline"
          git archive "$BASE_SHA" docker/manticore | tar -x -C "$RUNNER_TEMP/manticore-baseline"
          old="$RUNNER_TEMP/manticore-baseline/docker/manticore"
          base_tag=$(sed -n 's/^ARG MANTICORE_IMAGE=//p' docker/manticore/Dockerfile)
          composer_tag=$(sed -n 's/^ARG COMPOSER_IMAGE=//p' docker/manticore/Dockerfile)
          docker pull "$base_tag"
          docker pull "$composer_tag"
          base_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$base_tag")
          composer_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$composer_tag")
          printf 'Base: %s\nComposer: %s\n' "$base_ref" "$composer_ref" | tee image-inputs.txt

          # Use the candidate's base and Composer digests for both builds,
          # including comparisons against the original single-stage Dockerfile.
          if ! grep -q '^ARG MANTICORE_IMAGE=' "$old/Dockerfile"; then
            sed -i "1s|^FROM .*|FROM $base_ref|; s|COPY --from=composer:latest |COPY --from=$composer_ref |" "$old/Dockerfile"
          fi
          docker build --no-cache --progress=plain \
            --build-arg MANTICORE_IMAGE="$base_ref" --build-arg COMPOSER_IMAGE="$composer_ref" \
            --target runtime -t streams/manticore:optimized docker/manticore
          docker build --progress=plain \
            --build-arg MANTICORE_IMAGE="$base_ref" --build-arg COMPOSER_IMAGE="$composer_ref" \
            --target slim-runtime -t streams/manticore:slim docker/manticore
          docker build --progress=plain \
            --build-arg MANTICORE_IMAGE="$base_ref" --build-arg COMPOSER_IMAGE="$composer_ref" \
            --build-arg PRUNE_PROFILE=reference --target slim-runtime -t streams/manticore:reference docker/manticore
          docker run --rm --entrypoint cat streams/manticore:optimized \
            /etc/manticoresearch/composer.lock > manticore-composer.lock
          cmp docker/manticore/composer.lock manticore-composer.lock
          docker run --rm --entrypoint cat streams/manticore:slim \
            /etc/manticoresearch/composer.lock | cmp - manticore-composer.lock
          docker run --rm --entrypoint cat streams/manticore:reference \
            /etc/manticoresearch/composer.lock | cmp - manticore-composer.lock
          docker build --no-cache --progress=plain \
            --build-arg MANTICORE_IMAGE="$base_ref" --build-arg COMPOSER_IMAGE="$composer_ref" \
            -t streams/manticore:baseline "$old"
      - name: Inventory base and runtime payloads
        run: |
          set -euo pipefail
          base_ref=$(sed -n 's/^Base: //p' image-inputs.txt)
          for image in "$base_ref" streams/manticore:optimized streams/manticore:reference streams/manticore:slim; do
            {
              echo "=== $image ==="
              docker run --rm --user root --entrypoint sh "$image" -ec '
                echo "=== Largest packages (KiB) ==="
                dpkg-query -W -f='"'"'${Installed-Size}\t${Package}\t${Version}\n'"'"' | sort -nr | head -80
                echo "=== Manticore modules (bytes) ==="
                du -x -B1 -d 2 /usr/share/manticore/modules | sort -nr | head -80
                echo "=== Largest files in /usr (bytes) ==="
                find /usr -xdev -type f -printf "%s\t%p\n" | sort -nr | head -100
              '
            } | tee -a image-inventory.txt
          done
      - name: Compare image sizes and layers
        run: |
          set -euo pipefail
          base_ref=$(sed -n 's/^Base: //p' image-inputs.txt)
          size() { docker image inspect --format '{{.Size}}' "$1"; }
          archive_size() { docker save "$1" | gzip -n -1 | wc -c; }
          base=$(size "$base_ref")
          before=$(size streams/manticore:baseline)
          after=$(size streams/manticore:optimized)
          reference=$(size streams/manticore:reference)
          slim=$(size streams/manticore:slim)
          before_gz=$(archive_size streams/manticore:baseline)
          after_gz=$(archive_size streams/manticore:optimized)
          reference_gz=$(archive_size streams/manticore:reference)
          slim_gz=$(archive_size streams/manticore:slim)
          {
            echo '## Manticore Streams image size'
            echo
            cat image-inputs.txt
            echo
            echo '| Metric | Baseline | Optimized | Previous slim | Current slim | vs baseline | vs previous slim |'
            echo '| --- | ---: | ---: | ---: | ---: | ---: | ---: |'
            row() {
              awk -v name="$1" -v before="$2" -v after="$3" -v ref="$4" -v slim="$5" \
                'BEGIN { printf "| %s | %.1f MiB | %.1f MiB | %.1f MiB | %.1f MiB | %.1f%% | %.1f%% |\n", name, before/1048576, after/1048576, ref/1048576, slim/1048576, 100*(before-slim)/before, 100*(ref-slim)/ref }'
            }
            row 'Uncompressed image' "$before" "$after" "$reference" "$slim"
            row 'Gzip Docker archive' "$before_gz" "$after_gz" "$reference_gz" "$slim_gz"
            echo
            printf 'Base image: %s bytes; baseline: %s bytes; optimized: %s bytes; previous slim: %s bytes; slim: %s bytes.\n' "$base" "$before" "$after" "$reference" "$slim"
            echo 'All builds use the candidate base and Composer digests; APT package versions are resolved at build time.'
            echo 'The slim image is flattened and no longer shares the official base layer. Gzip savings do not predict pulls onto a node with the original base already cached.'
            echo 'Gzip archive sizes are a comparable transfer-size proxy, not registry layer sizes.'
          } | tee image-size.md
          cat image-size.md >> "$GITHUB_STEP_SUMMARY"
          for image in baseline optimized reference slim; do
            echo "=== $image layers ==="
            docker history --human=false --format '{{.Size}} {{.CreatedBy}}' "streams/manticore:$image"
          done
      - name: Verify flattened image configuration
        run: |
          docker image inspect streams/manticore:optimized streams/manticore:slim > image-config.json
          python3 - <<'PY'
          import json
          with open("image-config.json") as f:
              full, slim = json.load(f)
          for key in ("User", "Entrypoint", "Cmd", "WorkingDir", "ExposedPorts", "Volumes", "StopSignal", "Healthcheck"):
              assert full["Config"].get(key) == slim["Config"].get(key), (key, full["Config"].get(key), slim["Config"].get(key))
          def env(config):
              return dict(item.split("=", 1) for item in config.get("Env", []))
          assert env(full["Config"]) == env(slim["Config"]), (env(full["Config"]), env(slim["Config"]))
          print("Runtime configuration matches")
          PY
      - name: Check runtime files and dependencies as manticore
        run: |
          for image in optimized reference slim; do
            docker run --rm --entrypoint sh "streams/manticore:$image" -ec '
            test "$(id -u)" -ne 0
            for dir in /var/lib/manticore /var/log/manticore /var/run/manticore; do test -w "$dir"; done
            for lang in en de ru; do test -r "/usr/share/manticore/$lang.pak"; done
            test -x /etc/manticoresearch/manticore.conf
            test -x /etc/manticoresearch/starter.sh
            test -x /etc/manticoresearch/l_probe.sh
            test -x /etc/manticoresearch/r_probe.sh
            command -v searchd
            command -v mysql
            command -v supervisorctl
            command -v manticore-backup
            manticore-backup --version
            searchd --version
            mysql --version
            php -r '"'"'require "vendor/autoload.php"; if (PHP_VERSION_ID < 80513 || PHP_VERSION_ID >= 80600 || !extension_loaded("mysqli") || !extension_loaded("curl") || !class_exists("Core\\K8s\\ApiClient") || !class_exists("Core\\Manticore\\ManticoreStreamsConnector")) exit(1);'"'"'
            libs=$(ldd /etc/manticoresearch/plugins/blended.so)
            printf "%s\n" "$libs"
            ! printf "%s\n" "$libs" | grep -q "not found"
          '
          done
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4.6.2
        if: always()
        with:
          name: manticore-image-comparison
          path: |
            image-inputs.txt
            image-size.md
            image-inventory.txt
            image-config.json
            manticore-composer.lock
          retention-days: 7
