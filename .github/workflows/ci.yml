name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn test -DskipTests=false -Dmaven.test.skip=false
        working-directory: sources/src

  image-build:
    needs: worker-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component: [manticore, scaler, rules_checker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t streams/${{ matrix.component }}:ci -f docker/${{ matrix.component }}/Dockerfile docker/${{ matrix.component }}
      - name: Archive validated image
        run: |
          set -euo pipefail
          docker save streams/${{ matrix.component }}:ci | gzip > ${{ matrix.component }}.tar.gz
          gzip -t ${{ matrix.component }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ci-image-${{ matrix.component }}
          path: ${{ matrix.component }}.tar.gz
          retention-days: 1
          if-no-files-found: error

  ui-image-build:
    needs: worker-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component: [ui, ui-nginx]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: cp -a ui/. docker/${{ matrix.component }}/source/
      - run: docker build -t streams/${{ matrix.component }}:ci -f docker/${{ matrix.component }}/Dockerfile docker/${{ matrix.component }}
      - name: Archive validated image
        run: |
          set -euo pipefail
          docker save streams/${{ matrix.component }}:ci | gzip > ${{ matrix.component }}.tar.gz
          gzip -t ${{ matrix.component }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ci-image-${{ matrix.component }}
          path: ${{ matrix.component }}.tar.gz
          retention-days: 1
          if-no-files-found: error

  worker-image-build:
    needs: worker-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn clean compile assembly:single
        working-directory: sources/src
      - run: cp sources/src/target/KafkaPublisher-1.0-SNAPSHOT-jar-with-dependencies.jar docker/worker/KafkaHandler.jar
      - run: docker build -t streams/worker:ci docker/worker
      - name: Archive validated image
        run: |
          set -euo pipefail
          docker save streams/worker:ci | gzip > worker.tar.gz
          gzip -t worker.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ci-image-worker
          path: worker.tar.gz
          retention-days: 1
          if-no-files-found: error

  helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Materialize development chart version
        run: bash dev-environment/ci/materialize-chart-version.sh
      - run: helm lint helm-chart
      - run: helm template manticore-streams helm-chart --kube-version v1.32.5 > rendered-default.yaml
      - run: docker run --rm -v "$PWD:/work" -w /work ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -kubernetes-version 1.32.5 rendered-default.yaml

  changes:
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'docker/**'
              - 'ui/**'
              - 'sources/**'
              - 'helm-chart/**'
              - 'dev-environment/docker-compose.laravel-tests.yml'
              - 'dev-environment/k8s_tests/**'
              - '.github/workflows/ci.yml'

  laravel-tests:
    needs: [image-build, ui-image-build, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download Laravel test images
        uses: actions/download-artifact@v4
        with:
          pattern: ci-image-*
          path: ci-images
          merge-multiple: true
      - name: Load Laravel test images
        run: |
          set -euxo pipefail
          for component in manticore ui; do
            gzip -dc "ci-images/${component}.tar.gz" | docker load
            docker image inspect "streams/${component}:ci" >/dev/null
          done
      - name: Start Laravel test dependencies
        run: docker compose -f dev-environment/docker-compose.laravel-tests.yml up -d --wait mysql manticore columnar
      - name: Wait for Laravel database connection
        run: docker compose -f dev-environment/docker-compose.laravel-tests.yml run --rm --no-deps ui php -r 'for ($attempt = 0; $attempt < 60; $attempt++) { try { new PDO("mysql:host=mysql;dbname=mysql", "root", "mysql"); exit(0); } catch (Throwable $exception) { sleep(1); } } fwrite(STDERR, "MySQL did not accept a Laravel connection within 60 seconds\n"); exit(1);'
      - name: Initialize Laravel test Manticore schema
        run: docker compose -f dev-environment/docker-compose.laravel-tests.yml exec -T manticore php /etc/manticoresearch/alter.php --table=pq --batch=500
      - name: Initialize Laravel test metrics storage
        run: docker compose -f dev-environment/docker-compose.laravel-tests.yml exec -T columnar mysql -h 127.0.0.1 -P 9306 -e 'CREATE TABLE IF NOT EXISTS metrics (scrapTime timestamp, metric_name text, value float, tag string)'
      - name: Migrate and seed Laravel test database
        run: docker compose -f dev-environment/docker-compose.laravel-tests.yml run --rm --no-deps ui php artisan migrate:fresh --seed --force
      - name: Run Laravel Unit and Feature tests
        run: docker compose -f dev-environment/docker-compose.laravel-tests.yml run --rm --no-deps ui php -d short_open_tag=off ./vendor/bin/phpunit --do-not-cache-result --testsuite Dev --stderr
      - name: Collect Laravel test dependency logs
        if: always()
        run: docker compose -f dev-environment/docker-compose.laravel-tests.yml logs --no-color > laravel-test-dependencies.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laravel-test-dependencies
          path: laravel-test-dependencies.log
          retention-days: 7
          if-no-files-found: warn
      - name: Remove Laravel test dependencies
        if: always()
        run: docker compose -f dev-environment/docker-compose.laravel-tests.yml down --volumes --remove-orphans

  k8s-e2e:
    needs: [worker-tests, image-build, ui-image-build, worker-image-build, helm, changes, laravel-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      APP_NAMESPACE: manticore-streams
      KAFKA_NAMESPACE: kafka
      RELEASE_NAME: manticore-streams
      KAFKA_RELEASE_NAME: my-kafka
      KAFKA_FIXTURE_PRODUCER_POD: kafka-fixture-producer
      TIMEOUT_SECONDS: 600
      PIPELINE_CREATION_TIMEOUT_SECONDS: 60
      EXPECTED_RECORDS: 9418
      KAFKA_POD: my-kafka-controller-0
      UI_DEPLOYMENT: manticore-streams-manticoresearch-ui
      UI_CONTAINER: manticoresearch-ui
      K3S_VERSION: v1.32.5+k3s1
    steps:
      - uses: actions/checkout@v4
      - name: Skip unrelated pull request
        if: github.event_name == 'pull_request' && needs.changes.outputs.relevant != 'true'
        run: echo 'No Kubernetes-relevant files changed.'
      - uses: actions/setup-java@v5
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: azure/setup-helm@v4
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
      - uses: azure/setup-kubectl@v4
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
      - name: Install K3s
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: bash .github/scripts/k8s/install-k3s.sh
      - name: Materialize development chart version
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: bash .github/scripts/materialize-chart-version.sh
      - name: Download validated images
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: ci-image-*
          path: ci-images
          merge-multiple: true
      - name: Import validated images into K3s
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: bash .github/scripts/k8s/import-ci-images.sh
      - name: Install Kafka and chart
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: bash .github/scripts/k8s/install-streams-chart.sh
      - name: Wait for application workloads
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: bash .github/scripts/k8s/wait-for-application-workloads.sh
      - name: Create Kafka test topics
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: bash .github/scripts/k8s/create-kafka-test-topics.sh
      - name: Migrate and seed Laravel cluster test database
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: kubectl -n "$APP_NAMESPACE" exec "$UI_POD" -c "$UI_CONTAINER" -- php artisan migrate:fresh --seed --force
      - name: Configure Laravel cluster test environment
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: kubectl -n "$APP_NAMESPACE" exec "$UI_POD" -c "$UI_CONTAINER" -- sh -c 'sed -i "s/production/cluster_testing/g" .env && sed -i "s/testing/cluster_testing/g" phpunit.xml'
      - name: Seed Laravel cluster test user
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: kubectl -n "$APP_NAMESPACE" exec "$UI_POD" -c "$UI_CONTAINER" -- php artisan db:seed --class='\TestDataSeeder' --force
      - name: Run Laravel cluster integration tests
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: bash .github/scripts/k8s/run-laravel-cluster-tests.sh
      - name: Wait for generated pipeline
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: bash .github/scripts/k8s/wait-for-generated-pipeline.sh
      - name: Wait for Kafka consumer assignment
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: bash .github/scripts/k8s/wait-for-kafka-consumer-assignment.sh
      - name: Load Kafka test fixture
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: bash .github/scripts/k8s/capture-kafka-start-offsets.sh
      - name: Start Kafka fixture producer
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: bash .github/scripts/k8s/start-kafka-fixture-producer.sh
      - name: Publish Kafka test fixture
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: bash .github/scripts/k8s/publish-kafka-fixture.sh
      - name: Verify Kafka processing result
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: bash .github/scripts/k8s/verify-kafka-processing.sh
      - name: Collect diagnostics
        if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true')
        run: bash .github/scripts/k8s/collect-diagnostics.sh artifacts/k8s
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true')
        with:
          name: k8s-e2e-diagnostics
          path: |
            artifacts/
            artifacts-rendered-helm.yaml
          retention-days: 14

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: k8s-e2e
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Materialize image version
        run: |
          bash .github/scripts/materialize-chart-version.sh
          version=$(awk '/^appVersion:/ { print $2; exit }' helm-chart/Chart.yaml)
          case "$version" in *"\$Format:"*) echo 'Chart version was not materialized'; exit 1;; esac
          echo "IMAGE_TAG=${version}" >> "$GITHUB_ENV"
      - name: Download tested images
        uses: actions/download-artifact@v4
        with:
          pattern: ci-image-*
          path: ci-images
          merge-multiple: true
      - name: Push tested images to GHCR
        run: |
          set -euxo pipefail
          for image_archive in ci-images/*.tar.gz; do
            gzip -dc "$image_archive" | docker load
          done
          components=(manticore scaler rules_checker worker ui ui-nginx)
          for component in "${components[@]}"; do
            docker image inspect "streams/${component}:ci" >/dev/null
            image="ghcr.io/manticoresoftware/streams/${component}:${IMAGE_TAG}"
            docker tag "streams/${component}:ci" "$image"
            docker push "$image"
          done

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package release chart
        id: package
        run: |
          set -eux
          bash .github/scripts/materialize-chart-version.sh
          version=$(awk '/^version:/ { print $2; exit }' helm-chart/Chart.yaml)
          app_version=$(awk '/^appVersion:/ { print $2; exit }' helm-chart/Chart.yaml)
          test "$version" = "$app_version"
          case "$version" in *"\$Format:"*) echo 'Chart version was not materialized'; exit 1;; esac
          helm lint helm-chart
          helm package helm-chart --destination release-artifacts
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "asset=release-artifacts/manticoresearch-${version}.tgz" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.version }}
          name: ${{ steps.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.asset }}
          fail_on_unmatched_files: true
          overwrite_files: true
