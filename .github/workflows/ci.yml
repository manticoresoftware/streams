name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn test -DskipTests=false -Dmaven.test.skip=false
        working-directory: sources/src

  image-smoke:
    needs: worker-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component: [manticore, scaler, rules_checker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t streams/${{ matrix.component }}:ci -f docker/${{ matrix.component }}/Dockerfile docker/${{ matrix.component }}

  ui-image-smoke:
    needs: worker-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component: [ui, ui-nginx]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: cp -a ui/. docker/${{ matrix.component }}/source/
      - run: docker build -t streams/${{ matrix.component }}:ci -f docker/${{ matrix.component }}/Dockerfile docker/${{ matrix.component }}

  worker-image-smoke:
    needs: worker-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn clean compile assembly:single
        working-directory: sources/src
      - run: cp sources/src/target/KafkaPublisher-1.0-SNAPSHOT-jar-with-dependencies.jar docker/worker/KafkaHandler.jar
      - run: docker build -t streams/worker:ci docker/worker

  helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Materialize development chart version
        run: |
          set -eux
          short_sha=$(git rev-parse --short HEAD)
          sed -i "s/\$Format:%h\$/${short_sha}/g" helm-chart/Chart.yaml
      - run: helm lint helm-chart
      - run: helm template manticore-streams helm-chart --kube-version v1.32.5 > rendered-default.yaml
      - run: docker run --rm -v "$PWD:/work" -w /work ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -kubernetes-version 1.32.5 rendered-default.yaml

  changes:
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'docker/**'
              - 'ui/**'
              - 'sources/**'
              - 'helm-chart/**'
              - 'dev-environment/k8s_tests/**'
              - '.github/workflows/ci.yml'

  k8s-e2e:
    needs: [worker-tests, image-smoke, ui-image-smoke, worker-image-smoke, helm, changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Skip unrelated pull request
        if: github.event_name == 'pull_request' && needs.changes.outputs.relevant != 'true'
        run: echo 'No Kubernetes-relevant files changed.'
      - uses: actions/setup-java@v4
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: azure/setup-helm@v4
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
      - uses: azure/setup-kubectl@v4
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
      - uses: helm/kind-action@v1.12.0
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        with:
          version: v0.26.0
          node_image: kindest/node:v1.32.5
          config: dev-environment/k8s_tests/kind-config.yaml
      - name: Materialize development chart version
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: |
          set -eux
          short_sha=$(git rev-parse --short HEAD)
          sed -i "s/\$Format:%h\$/${short_sha}/g" helm-chart/Chart.yaml
      - name: Build local images
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: |
          set -eux
          tag=$(awk '/^appVersion:/ { print $2; exit }' helm-chart/Chart.yaml)
          mvn clean compile assembly:single -f "sources/src/pom.xml"
          cp "sources/src/target/KafkaPublisher-1.0-SNAPSHOT-jar-with-dependencies.jar" "docker/worker/KafkaHandler.jar"
          cp -a "ui/." "docker/ui/source/"
          cp -a "ui/." "docker/ui-nginx/source/"
          for component in manticore scaler rules_checker worker; do
            docker build -t "ghcr.io/manticoresoftware/streams/${component}:${tag}" "docker/${component}"
          done
          docker build -t "ghcr.io/manticoresoftware/streams/ui:${tag}" docker/ui
          docker build -t "ghcr.io/manticoresoftware/streams/ui-nginx:${tag}" docker/ui-nginx
          mapfile -t images < <(docker images --format '{{.Repository}}:{{.Tag}}' | grep "ghcr.io/manticoresoftware/streams/.*:${tag}")
          kind load docker-image "${images[@]}"
      - name: Install Kafka and chart
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: |
          set -eux
          export TIMEOUT_SECONDS=600
          sh dev-environment/k8s_tests/install-kafka.sh
          tag=$(awk '/^appVersion:/ { print $2; exit }' helm-chart/Chart.yaml)
          ci_overrides=(
            --set ingress.enabled=false
            --set podSecurityPolicy.enabled=false
            --set-json 'imagePullSecrets=[]'
            --set 'worker.resources.requests.cpu=250m'
            --set 'worker.resources.requests.memory=512Mi'
            --set 'worker.resources.limits.cpu=1'
            --set 'worker.resources.limits.memory=1Gi'
            --set-string "ui.image.tag=${tag}"
            --set-string "ui.nginx.image.tag=${tag}"
            --set-string "scaler.php.image.tag=${tag}"
            --set-string "worker.image.tag=${tag}"
            --set-string "manticore.image.tag=${tag}"
            --set-string "rulesChecker.image.tag=${tag}"
          )
          helm template manticore-streams helm-chart --kube-version v1.32.5 "${ci_overrides[@]}" > artifacts-rendered-helm.yaml
          helm upgrade --install manticore-streams helm-chart --namespace manticore-streams --create-namespace --wait --timeout 600s "${ci_overrides[@]}"
      - name: Run functional test
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: TIMEOUT_SECONDS=600 sh dev-environment/k8s_tests/test.sh
      - name: Collect diagnostics
        if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true')
        run: sh dev-environment/k8s_tests/collect-diagnostics.sh artifacts/k8s
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true')
        with:
          name: k8s-e2e-diagnostics
          path: |
            artifacts/
            artifacts-rendered-helm.yaml
          retention-days: 14

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: k8s-e2e
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        component: [manticore, scaler, rules_checker, worker, ui, ui-nginx]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.component == 'worker'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare build context
        run: |
          set -eux
          short_sha=$(git rev-parse --short HEAD)
          sed -i "s/\$Format:%h\$/${short_sha}/g" helm-chart/Chart.yaml
          if [ "${{ matrix.component }}" = "worker" ]; then
            mvn clean compile assembly:single -f sources/src/pom.xml
            cp sources/src/target/KafkaPublisher-1.0-SNAPSHOT-jar-with-dependencies.jar docker/worker/KafkaHandler.jar
          fi
          if [ "${{ matrix.component }}" = "ui" ] || [ "${{ matrix.component }}" = "ui-nginx" ]; then
            cp -a ui/. docker/${{ matrix.component }}/source/
          fi
          version=$(awk '/^appVersion:/ { print $2; exit }' helm-chart/Chart.yaml)
          case "$version" in *"\$Format:"*) echo 'Chart version was not materialized'; exit 1;; esac
          echo "IMAGE_TAG=${version}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: docker/${{ matrix.component }}
          push: true
          tags: ghcr.io/manticoresoftware/streams/${{ matrix.component }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package release chart
        id: package
        run: |
          set -eux
          short_sha=$(git rev-parse --short HEAD)
          sed -i "s/\$Format:%h\$/${short_sha}/g" helm-chart/Chart.yaml
          version=$(awk '/^version:/ { print $2; exit }' helm-chart/Chart.yaml)
          app_version=$(awk '/^appVersion:/ { print $2; exit }' helm-chart/Chart.yaml)
          test "$version" = "$app_version"
          case "$version" in *"\$Format:"*) echo 'Chart version was not materialized'; exit 1;; esac
          helm lint helm-chart
          helm package helm-chart --destination release-artifacts
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "asset=release-artifacts/manticoresearch-${version}.tgz" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.version }}
          name: ${{ steps.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.asset }}
          fail_on_unmatched_files: true
          overwrite_files: true
