apiVersion: v1
kind: ServiceAccount
metadata:
  name: ui-admin-sa-{{ .Release.Namespace }}
  labels:
    name: {{ include "manticore-streams.name" . }}
    {{- include "manticore-streams.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ui-admin-role-{{ .Release.Namespace }}
rules:
  - apiGroups: ['policy']
    resources: ['podsecuritypolicies']
    verbs: ['use']
    resourceNames:
      - {{ include "manticore-streams.fullname" . }}
  - apiGroups: ['']
    resources: ['configmaps','persistentvolumeclaims','pods', 'services','secrets']
    verbs: ["*"]
  - apiGroups: ['apps']
    resources: ['deployments', 'statefulsets', 'deployments/scale', 'statefulsets/scale']
    verbs: ["*"]
  - apiGroups: ['extensions']
    resources: ['deployments', 'deployments/scale']
    verbs: ["*"]
  - apiGroups: ['batch']
    resources: ['cronjobs']
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ui-admin-{{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ui-admin-role-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: ui-admin-sa-{{ .Release.Namespace }}
    namespace: {{ .Release.Namespace }}
