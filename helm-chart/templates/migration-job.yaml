apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-ui-migrate-%d" (.Release.Name | trunc 40 | trimSuffix "-") .Release.Revision }}
  labels:
    name: {{ .Chart.Name }}-ui-migrate
    {{- include "manticore-streams.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.ui.hooks.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.ui.hooks.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.ui.hooks.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        name: {{ .Chart.Name }}-ui-migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: ui-admin-sa-{{ .Release.Namespace }}
      securityContext:
        fsGroup: {{ .Values.ui.userId }}
      initContainers:
      - name: wait-{{ .Chart.Name }}-ui-mysql
        image: {{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag | default .Chart.AppVersion}}
        imagePullPolicy: {{ .Values.ui.image.imagePullPolicy }}
        command:
          - sh
          - -c
          - |
            for i in $(seq 1 {{ .Values.ui.migrationWait.maxAttempts }}); do
              if php -r 'exit(@fsockopen(getenv("DB_HOST"), (int) getenv("DB_PORT"), $errno, $errstr, 2) ? 0 : 1);'; then
                echo "MySQL is reachable"
                exit 0
              fi

              echo "Waiting for MySQL to become reachable ($i/{{ .Values.ui.migrationWait.maxAttempts }})"
              sleep {{ .Values.ui.migrationWait.sleepSeconds }}
            done

            echo "MySQL did not become reachable in time"
            exit 1
        securityContext:
          runAsGroup: {{ .Values.ui.userId }}
          runAsUser: {{ .Values.ui.userId }}
        env:
          - name: DB_HOST
            value: "{{ include "manticore-streams.fullname" . }}-mysql-service"
          - name: DB_PORT
            value: "{{ .Values.mysql.service.port }}"
        resources:
          {{- toYaml .Values.ui.initResources | nindent 10 }}
      containers:
      - name: {{ .Chart.Name }}-ui-migrate
        image: {{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag | default .Chart.AppVersion}}
        imagePullPolicy: {{ .Values.ui.image.imagePullPolicy }}
        command: ["php", "artisan", "chart:migrate"]
        securityContext:
          runAsGroup: {{ .Values.ui.userId }}
          runAsUser: {{ .Values.ui.userId }}
        volumeMounts:
          - name: process-config
            mountPath: "/var/www/html/storage/config/process.json"
            subPath: process.json
            readOnly: true
        env:
          - name: DB_HOST
            value: "{{ include "manticore-streams.fullname" . }}-mysql-service"
          - name: DB_DATABASE
            value: "{{.Values.ui.database.name}}"
          - name: DB_USER
            value: "{{.Values.ui.database.user}}"
          - name: DB_SECRET
            value: "{{ .Values.ui.database.secret }}"
          - name: SUPERADMIN_EMAIL
            value: "{{.Values.ui.admin.email}}"
          - name: SUPERADMIN_PASSWORD
            value: "{{.Values.ui.admin.pass}}"
          - name: PHP_MEM_LIMIT
            value: "1024"
        resources:
          {{- toYaml .Values.ui.initResources | nindent 10 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: process-config
          configMap:
            name: {{ include "manticore-streams.name" . }}-configmap
