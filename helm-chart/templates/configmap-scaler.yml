apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-scaler-config
  labels:
    app: {{ .Chart.Name }}-scaler
    component: nginx-php-fpm
data:
  nginx.conf: |
    worker_processes  1;
    pid        /tmp/nginx.pid;
    events {
        worker_connections  1024;
    }
    http {
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path       /tmp/proxy_temp_path;
        fastcgi_temp_path     /tmp/fastcgi_temp;
        uwsgi_temp_path       /tmp/uwsgi_temp;
        scgi_temp_path        /tmp/scgi_temp;
        log_format custom '$remote_addr [$time_local] $request_time $request $status';
        server {
            listen {{ .Values.scaler.service.targetPort }};
            root /var/www/html;
            access_log /dev/stdout custom;
            index index.php;
            server_name _;
            include  /etc/nginx/mime.types;
            location / {
                try_files $uri $uri/ /index.php$is_args$args;
            }
            location /nginx_status {
                stub_status;
                allow 127.0.0.1;
                deny all;
            }
            location ~ \.php$ {
                try_files $uri /index.php =404;
                include fastcgi_params;
                fastcgi_param REQUEST_METHOD $request_method;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                fastcgi_pass 127.0.0.1:9000;
            }
        }
    }
  www.conf: |
    [www]
    user = {{ .Values.scaler.php.config.user }}
    group = {{ .Values.scaler.php.config.user }}
    listen = 9000
    pm = dynamic
    pm.max_children = {{ .Values.scaler.php.config.max_children }}
    pm.start_servers = {{ .Values.scaler.php.config.start_servers }}
    pm.min_spare_servers = {{ .Values.scaler.php.config.min_spare_servers }}
    pm.max_spare_servers = {{ .Values.scaler.php.config.max_spare_servers }}
    pm.process_idle_timeout = 10s;
    pm.max_requests = {{ .Values.scaler.php.config.max_requests }}